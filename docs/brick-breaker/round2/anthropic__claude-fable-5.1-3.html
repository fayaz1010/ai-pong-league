<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brick Breaker</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#ddd}
  canvas#game{background:#000;display:block;box-shadow:0 0 40px rgba(80,120,255,.25);border:1px solid #223}
  #info{margin-top:8px;font-size:12px;color:#889}
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="info">&larr; &rarr; / mouse: move &nbsp;&middot;&nbsp; Space: launch / restart &nbsp;&middot;&nbsp; P: pause &nbsp;&middot;&nbsp; A: autopilot</div>
<script>
(function(){
'use strict';
var W=800,H=600;
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');

var PADDLE_W=100,PADDLE_H=14,PADDLE_Y=H-40,PADDLE_SPEED=8;
var BALL_R=7,BALL_SPEED=6,MAX_ANGLE=Math.PI/3;
var BRICK_COLS=10,BRICK_W=70,BRICK_H=22,BRICK_GAP=6,BRICK_TOP=60;
var BRICK_LEFT=(W-(BRICK_COLS*BRICK_W+(BRICK_COLS-1)*BRICK_GAP))/2;
var WIDE_FRAMES=600,PU_W=34,PU_H=16,PU_SPEED=2;
var AP_SPEED=16;

/* ---------- deterministic RNG (mulberry32) ---------- */
var rngState=20240601;
function rng(){
  rngState=(rngState+0x6D2B79F5)|0;
  var t=Math.imul(rngState^(rngState>>>15),1|rngState);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
function seed(n){ rngState=(Number(n)|0); }

/* ---------- game state ---------- */
var score=0,lives=3,level=1,state='ready',prevState='ready';
var balls=[],bricks=[],powerUps=[];
var paddle={x:W/2-PADDLE_W/2,y:PADDLE_Y,w:PADDLE_W,h:PADDLE_H};
var wideTimer=0;
var autopilot=false;
var highScore=0;
var keys={left:false,right:false};
var apLaunchDelay=30,apBall=null,apBrick=null,apLastDy=0,apLastHits=-1,apNoProgress=0;

try{ highScore=parseInt(localStorage.getItem('bb_highscore'),10)||0; }catch(e){ highScore=0; }
function saveHigh(){
  if(score>highScore){
    highScore=score;
    try{ localStorage.setItem('bb_highscore',String(highScore)); }catch(e){}
  }
}

/* ---------- levels ---------- */
function addBrick(r,c,hits){
  bricks.push({x:BRICK_LEFT+c*(BRICK_W+BRICK_GAP),y:BRICK_TOP+r*(BRICK_H+BRICK_GAP),w:BRICK_W,h:BRICK_H,hits:hits,maxHits:hits});
}
function buildLevel(lv){
  bricks=[];
  var r,c;
  if(lv===1){
    for(r=0;r<5;r++) for(c=0;c<BRICK_COLS;c++) addBrick(r,c,1);
  }else if(lv===2){
    for(r=0;r<6;r++) for(c=0;c<BRICK_COLS;c++) addBrick(r,c,r<2?2:1);
  }else{
    for(r=0;r<7;r++) for(c=0;c<BRICK_COLS;c++){
      if(r>=2 && (c+r)%4===0) continue;
      addBrick(r,c,(r<2||(r===4&&(c===2||c===7)))?2:1);
    }
  }
}

function clampPaddle(){
  if(paddle.x<0) paddle.x=0;
  if(paddle.x+paddle.w>W) paddle.x=W-paddle.w;
}
function setPaddleWidth(w){
  var cx=paddle.x+paddle.w/2;
  paddle.w=w; paddle.x=cx-w/2; clampPaddle();
}
function resetBall(){
  balls=[{x:paddle.x+paddle.w/2,y:paddle.y-BALL_R,dx:0,dy:0}];
  state='ready'; apLaunchDelay=30; apBall=null; apBrick=null;
}
function launchAll(){
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(b.dx===0&&b.dy===0){
      var ang=(rng()*2-1)*(Math.PI/5);
      b.dx=BALL_SPEED*Math.sin(ang); b.dy=-BALL_SPEED*Math.cos(ang);
    }
  }
  state='playing';
}
function newGame(){
  score=0; lives=3; level=1; powerUps=[]; wideTimer=0;
  paddle.w=PADDLE_W; paddle.x=W/2-PADDLE_W/2;
  buildLevel(1); resetBall();
  apLastHits=-1; apNoProgress=0;
}

/* ---------- collisions ---------- */
function hitBrick(b,px,py,list,destroy){
  for(var i=0;i<list.length;i++){
    var k=list[i];
    if(b.x+BALL_R>k.x && b.x-BALL_R<k.x+k.w && b.y+BALL_R>k.y && b.y-BALL_R<k.y+k.h){
      var fromSide=(px+BALL_R<=k.x || px-BALL_R>=k.x+k.w);
      var fromVert=(py+BALL_R<=k.y || py-BALL_R>=k.y+k.h);
      if(fromSide&&!fromVert){
        b.dx=-b.dx; b.x=b.dx>0?k.x+k.w+BALL_R:k.x-BALL_R;
      }else if(fromVert&&!fromSide){
        b.dy=-b.dy; b.y=b.dy>0?k.y+k.h+BALL_R:k.y-BALL_R;
      }else{
        b.dx=-b.dx; b.dy=-b.dy;
      }
      if(destroy) onBrickHit(i);
      return true;
    }
  }
  return false;
}
function onBrickHit(i){
  var k=bricks[i];
  k.hits--; score+=10; saveHigh();
  if(k.hits<=0){
    bricks.splice(i,1);
    if(rng()<0.1) spawnPowerUp(rng()<0.5?'wide':'multi',k.x+k.w/2,k.y+k.h/2);
    if(bricks.length===0) levelClear();
  }
}
function levelClear(){
  powerUps=[];
  if(level<3){ level++; buildLevel(level); resetBall(); }
  else { state='won'; }
}
function loseLife(){
  lives--; powerUps=[];
  if(lives<=0){ lives=0; state='over'; }
  else resetBall();
}
function spawnPowerUp(type,x,y){
  if(type!=='wide'&&type!=='multi') return;
  powerUps.push({type:type,x:Number(x)-PU_W/2,y:Number(y)-PU_H/2,w:PU_W,h:PU_H});
}
function applyPowerUp(type){
  if(type==='wide'){
    wideTimer=WIDE_FRAMES;
    if(paddle.w!==PADDLE_W*2) setPaddleWidth(PADDLE_W*2);
  }else if(type==='multi'){
    if(balls.length===0) balls.push({x:paddle.x+paddle.w/2,y:paddle.y-BALL_R,dx:0,dy:0});
    if(state==='ready') launchAll();
    var src=balls[0];
    var base=src.dy<0?Math.atan2(src.dx,-src.dy):0;
    for(var s=-1;s<=1;s+=2){
      var a=base+s*0.6;
      balls.push({x:src.x,y:src.y,dx:BALL_SPEED*Math.sin(a),dy:-BALL_SPEED*Math.cos(a)});
    }
  }
}

/* ---------- simulation ---------- */
function moveBalls(){
  for(var i=balls.length-1;i>=0;i--){
    var b=balls[i];
    var px=b.x,py=b.y;
    b.x+=b.dx; b.y+=b.dy;
    if(b.x-BALL_R<0){ b.x=BALL_R; b.dx=Math.abs(b.dx); }
    if(b.x+BALL_R>W){ b.x=W-BALL_R; b.dx=-Math.abs(b.dx); }
    if(b.y-BALL_R<0){ b.y=BALL_R; b.dy=Math.abs(b.dy); }
    // paddle
    if(b.dy>0 && b.y+BALL_R>=paddle.y && b.y-BALL_R<paddle.y+paddle.h &&
       b.x+BALL_R>paddle.x && b.x-BALL_R<paddle.x+paddle.w && py+BALL_R<=paddle.y+4){
      var rel=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      rel=Math.max(-1,Math.min(1,rel));
      var ang=rel*MAX_ANGLE;
      b.dx=BALL_SPEED*Math.sin(ang); b.dy=-BALL_SPEED*Math.cos(ang);
      b.y=paddle.y-BALL_R;
    }
    hitBrick(b,px,py,bricks,true);
    if(state!=='playing') return;
    if(b.y-BALL_R>H){
      balls.splice(i,1);
      if(balls.length===0){ loseLife(); return; }
    }
  }
}
function movePowerUps(){
  for(var i=powerUps.length-1;i>=0;i--){
    var p=powerUps[i];
    p.y+=PU_SPEED;
    if(p.y+p.h>=paddle.y && p.y<=paddle.y+paddle.h && p.x+p.w>paddle.x && p.x<paddle.x+paddle.w){
      powerUps.splice(i,1);
      applyPowerUp(p.type);
    }else if(p.y>H){
      powerUps.splice(i,1);
    }
  }
}
function step(){
  if(autopilot) runAutopilot();
  else{
    if(keys.left) paddle.x-=PADDLE_SPEED;
    if(keys.right) paddle.x+=PADDLE_SPEED;
  }
  clampPaddle();
  if(wideTimer>0){ wideTimer--; if(wideTimer===0) setPaddleWidth(PADDLE_W); }
  if(state==='ready'){
    for(var i=0;i<balls.length;i++){
      var b=balls[i];
      if(b.dx===0&&b.dy===0){ b.x=paddle.x+paddle.w/2; b.y=paddle.y-BALL_R; }
    }
  }
  if(state==='playing') moveBalls();
  if(state==='playing'||state==='ready') movePowerUps();
}

/* ---------- autopilot ---------- */
function predict(b){
  var v={x:b.x,y:b.y,dx:b.dx,dy:b.dy};
  for(var t=0;t<1500;t++){
    var px=v.x,py=v.y;
    v.x+=v.dx; v.y+=v.dy;
    if(v.x-BALL_R<0){ v.x=BALL_R; v.dx=Math.abs(v.dx); }
    if(v.x+BALL_R>W){ v.x=W-BALL_R; v.dx=-Math.abs(v.dx); }
    if(v.y-BALL_R<0){ v.y=BALL_R; v.dy=Math.abs(v.dy); }
    if(v.dy>0 && v.y+BALL_R>=paddle.y) return {x:v.x,t:t};
    hitBrick(v,px,py,bricks,false);
  }
  return null;
}
function pickBrick(landX){
  if(!bricks.length) return null;
  if(apNoProgress>600) return bricks[Math.floor(rng()*bricks.length)];
  var best=null,bd=Infinity;
  for(var i=0;i<bricks.length;i++){
    var k=bricks[i];
    var d=Math.abs(k.x+k.w/2-landX)-k.y*0.3;
    if(d<bd){ bd=d; best=k; }
  }
  return best;
}
function apMove(cx){
  var cur=paddle.x+paddle.w/2;
  var d=cx-cur;
  if(d===0) return;
  var s=Math.min(Math.abs(d),AP_SPEED);
  paddle.x+=(d>0?1:-1)*s;
}
function runAutopilot(){
  if(state==='ready'){
    apMove(W/2);
    if(apLaunchDelay>0) apLaunchDelay--; else launchAll();
    return;
  }
  if(state!=='playing'||balls.length===0) return;
  var hitsLeft=0,i;
  for(i=0;i<bricks.length;i++) hitsLeft+=bricks[i].hits;
  if(hitsLeft!==apLastHits){ apLastHits=hitsLeft; apNoProgress=0; } else apNoProgress++;
  var best=null;
  for(i=0;i<balls.length;i++){
    var p=predict(balls[i]);
    if(p&&(!best||p.t<best.t)){ best=p; best.ball=balls[i]; }
  }
  var target;
  if(!best){
    var low=balls[0];
    for(i=1;i<balls.length;i++) if(balls[i].y>low.y) low=balls[i];
    target=low.x;
  }else{
    var ball=best.ball;
    var bounced=(ball===apBall && ball.dy<0 && apLastDy>0);
    if(ball!==apBall||!apBrick||bricks.indexOf(apBrick)<0||bounced) apBrick=pickBrick(best.x);
    apBall=ball; apLastDy=ball.dy;
    var rel=0;
    if(apBrick){
      var ang=Math.atan2(apBrick.x+apBrick.w/2-best.x,paddle.y-(apBrick.y+apBrick.h));
      rel=Math.max(-0.8,Math.min(0.8,ang/MAX_ANGLE));
    }
    target=best.x-rel*(paddle.w/2);
  }
  apMove(target);
}

/* ---------- drawing ---------- */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function draw(){
  var i;
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0c1024'); bg.addColorStop(1,'#050509');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // bricks
  for(i=0;i<bricks.length;i++){
    var k=bricks[i];
    var row=Math.round((k.y-BRICK_TOP)/(BRICK_H+BRICK_GAP));
    var hue=(row*45+level*30)%360;
    if(k.maxHits>1&&k.hits>1){
      ctx.fillStyle='#7d8a9c';
      rrect(k.x,k.y,k.w,k.h,3); ctx.fill();
      ctx.strokeStyle='#c7d2e0'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(k.x+4,k.y+3,k.w-8,3);
    }else{
      ctx.fillStyle='hsl('+hue+',70%,55%)';
      rrect(k.x,k.y,k.w,k.h,3); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(k.x+4,k.y+3,k.w-8,3);
      if(k.maxHits>1){
        ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(k.x+10,k.y+2); ctx.lineTo(k.x+28,k.y+12); ctx.lineTo(k.x+22,k.y+20);
        ctx.moveTo(k.x+28,k.y+12); ctx.lineTo(k.x+50,k.y+8); ctx.lineTo(k.x+60,k.y+20); ctx.stroke();
      }
    }
  }

  // power-ups
  for(i=0;i<powerUps.length;i++){
    var p=powerUps[i];
    ctx.fillStyle=p.type==='wide'?'#3ddc84':'#ffa726';
    rrect(p.x,p.y,p.w,p.h,5); ctx.fill();
    ctx.fillStyle='#111'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.type==='wide'?'WIDE':'MULTI',p.x+p.w/2,p.y+p.h/2+1);
  }

  // paddle
  var pg=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);
  pg.addColorStop(0,'#9fd3ff'); pg.addColorStop(1,'#2a7bd6');
  ctx.fillStyle=pg; rrect(paddle.x,paddle.y,paddle.w,paddle.h,7); ctx.fill();

  // balls
  for(i=0;i<balls.length;i++){
    var b=balls[i];
    ctx.beginPath(); ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.shadowColor='#8cf'; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
  }

  // HUD
  ctx.fillStyle='#e8ecf5'; ctx.font='bold 16px Arial'; ctx.textBaseline='middle';
  ctx.textAlign='left'; ctx.fillText('SCORE '+score,16,24);
  ctx.textAlign='center'; ctx.fillText('LIVES '+lives,W*0.38,24);
  ctx.fillText('LEVEL '+level,W*0.62,24);
  ctx.textAlign='right'; ctx.fillText('HIGH '+highScore,W-16,24);
  if(autopilot){
    ctx.fillStyle='#3ddc84'; ctx.font='12px Arial'; ctx.textAlign='center';
    ctx.fillText('AUTOPILOT ON',W/2,44);
  }
  if(wideTimer>0){
    ctx.fillStyle='#3ddc84'; ctx.fillRect(paddle.x,paddle.y+paddle.h+4,paddle.w*wideTimer/WIDE_FRAMES,3);
  }

  // overlays
  var msg=null,sub=null;
  if(state==='ready'){ msg=null; sub=autopilot?'Autopilot launching...':'Press SPACE to launch'; }
  else if(state==='paused'){ msg='PAUSED'; sub='Press P to resume'; }
  else if(state==='over'){ msg='GAME OVER'; sub='Press SPACE to restart'; }
  else if(state==='won'){ msg='YOU WIN'; sub='Score '+score+'  -  Press SPACE to play again'; }
  if(msg||sub){
    if(msg){
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,H/2-70,W,140);
      ctx.fillStyle='#fff'; ctx.font='bold 48px Arial'; ctx.textAlign='center';
      ctx.fillText(msg,W/2,H/2-14);
    }
    ctx.fillStyle='#cfd8e8'; ctx.font='18px Arial'; ctx.textAlign='center';
    ctx.fillText(sub,W/2,msg?H/2+34:H/2+60);
  }
}

/* ---------- input ---------- */
window.addEventListener('keydown',function(e){
  var key=e.key||'';
  var code=e.code||'';
  if(code==='ArrowLeft'||key==='ArrowLeft'||key==='Left'){ keys.left=true; e.preventDefault(); }
  else if(code==='ArrowRight'||key==='ArrowRight'||key==='Right'){ keys.right=true; e.preventDefault(); }
  else if(code==='Space'||key===' '||key==='Spacebar'){
    e.preventDefault();
    if(e.repeat) return;
    if(state==='ready') launchAll();
    else if(state==='over'||state==='won') newGame();
  }
  else if(code==='KeyP'||key.toLowerCase()==='p'){
    if(e.repeat) return;
    if(state==='playing'||state==='ready'){ prevState=state; state='paused'; }
    else if(state==='paused'){ state=prevState; }
  }
  else if(code==='KeyA'||key.toLowerCase()==='a'){
    if(e.repeat) return;
    autopilot=!autopilot;
  }
});
window.addEventListener('keyup',function(e){
  var key=e.key||'',code=e.code||'';
  if(code==='ArrowLeft'||key==='ArrowLeft'||key==='Left') keys.left=false;
  else if(code==='ArrowRight'||key==='ArrowRight'||key==='Right') keys.right=false;
});
canvas.addEventListener('mousemove',function(e){
  if(autopilot) return;
  var rect=canvas.getBoundingClientRect();
  var mx=(e.clientX-rect.left)*(W/rect.width);
  paddle.x=mx-paddle.w/2; clampPaddle();
});

/* ---------- test interface ---------- */
function tick(n){
  n=Math.max(0,Math.floor(Number(n)||0));
  var wasPaused=(state==='paused');
  if(wasPaused) state=prevState||'playing';
  for(var i=0;i<n;i++) step();
  if(wasPaused&&(state==='playing'||state==='ready')){ prevState=state; state='paused'; }
  draw();
}
function setBall(x,y,dx,dy){
  balls=[{x:Number(x),y:Number(y),dx:Number(dx),dy:Number(dy)}];
  state='playing'; apBall=null; apBrick=null;
}
var game={};
Object.defineProperties(game,{
  score:{get:function(){return score;},enumerable:true},
  lives:{get:function(){return lives;},enumerable:true},
  level:{get:function(){return level;},enumerable:true},
  state:{get:function(){return state;},enumerable:true},
  balls:{get:function(){return balls;},enumerable:true},
  paddle:{get:function(){return paddle;},enumerable:true},
  bricks:{get:function(){return bricks;},enumerable:true},
  bricksLeft:{get:function(){return bricks.length;},enumerable:true},
  autopilot:{get:function(){return autopilot;},set:function(v){autopilot=!!v;},enumerable:true}
});
game.tick=tick;
game.seed=seed;
game.setBall=setBall;
game.spawnPowerUp=spawnPowerUp;
window.game=game;

/* ---------- main loop ---------- */
newGame();
function frame(){
  if(state!=='paused') step();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

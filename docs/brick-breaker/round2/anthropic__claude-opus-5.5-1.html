<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: Arial, Helvetica, sans-serif; color: #ccc; }
  canvas { display: block; background: #000; border: 2px solid #444; }
  #help { margin-top: 8px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">Arrows / Mouse: move &nbsp;|&nbsp; Space: launch / restart &nbsp;|&nbsp; P: pause &nbsp;|&nbsp; A: autopilot</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var W = 800, H = 600;
  var R = 6;                 // ball radius
  var BASE_W = 100;          // paddle base width
  var PADDLE_H = 14;
  var PADDLE_Y = H - 40;
  var KEY_SPEED = 8;
  var AUTO_SPEED = 20;
  var MAXA = Math.PI / 3;    // max bounce angle from vertical
  var BW = 70, BH = 22, GAP = 6, LEFT = 23, TOP = 60;
  var HS_KEY = 'bb_highscore';

  // ---------- RNG ----------
  var rngState = (Date.now() & 0x7fffffff) | 0;
  function rng() {
    rngState = (rngState + 0x6D2B79F5) | 0;
    var t = rngState;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---------- State ----------
  var score = 0, lives = 3, level = 1;
  var state = 'ready';
  var paused = false;
  var autopilot = false;
  var balls = [];
  var bricks = [];
  var powerups = [];
  var paddle = { x: W / 2 - BASE_W / 2, y: PADDLE_Y, w: BASE_W };
  var wideTimer = 0;
  var readyTimer = 0;
  var framesSinceHit = 0;
  var frame = 0;
  var keys = { left: false, right: false };
  var highScore = 0;

  try {
    var hs = parseInt(localStorage.getItem(HS_KEY), 10);
    if (!isNaN(hs) && hs > 0) highScore = hs;
  } catch (e) { /* ignore */ }

  function saveHigh() {
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) { /* ignore */ }
    }
  }

  function levelSpeed() {
    return level === 1 ? 5 : (level === 2 ? 5.5 : 6);
  }

  // ---------- Levels ----------
  function makeBrick(r, c, hits) {
    return { x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), w: BW, h: BH, hits: hits, maxHits: hits, row: r };
  }

  function buildLevel(n) {
    var list = [], r, c;
    if (n === 1) {
      for (r = 0; r < 5; r++) for (c = 0; c < 10; c++) list.push(makeBrick(r, c, 1));
    } else if (n === 2) {
      for (r = 0; r < 6; r++) for (c = 0; c < 10; c++) list.push(makeBrick(r, c, r < 2 ? 2 : 1));
    } else {
      for (r = 0; r < 7; r++) {
        for (c = 0; c < 10; c++) {
          if ((r === 2 || r === 4) && (c === 0 || c === 9)) continue;
          if (r === 6 && c % 3 === 1) continue;
          var hits = (r < 2 || c === 4 || c === 5) ? 2 : 1;
          list.push(makeBrick(r, c, hits));
        }
      }
    }
    return list;
  }

  function clampPaddle() {
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > W) paddle.x = W - paddle.w;
  }

  function setPaddleWidth(w) {
    var cx = paddle.x + paddle.w / 2;
    paddle.w = w;
    paddle.x = cx - w / 2;
    clampPaddle();
  }

  function heldBall() {
    return { x: paddle.x + paddle.w / 2, y: paddle.y - R, dx: 0, dy: 0 };
  }

  function resetToReady() {
    balls = [heldBall()];
    state = 'ready';
    readyTimer = 0;
    framesSinceHit = 0;
  }

  function loadLevel(n) {
    level = n;
    bricks = buildLevel(n);
    powerups = [];
    wideTimer = 0;
    setPaddleWidth(BASE_W);
    resetToReady();
  }

  function restart() {
    score = 0;
    lives = 3;
    paused = false;
    paddle.x = W / 2 - BASE_W / 2;
    loadLevel(1);
  }

  function launch() {
    if (state !== 'ready') return;
    var sp = levelSpeed();
    var a = (rng() * 2 - 1) * (Math.PI / 6);
    var b = balls[0] || heldBall();
    b.x = paddle.x + paddle.w / 2;
    b.y = paddle.y - R;
    b.dx = sp * Math.sin(a);
    b.dy = -sp * Math.cos(a);
    balls = [b];
    state = 'playing';
    framesSinceHit = 0;
  }

  // ---------- Power-ups ----------
  function spawnPowerUp(type, x, y) {
    if (type !== 'wide' && type !== 'multi') return;
    powerups.push({ type: type, x: +x, y: +y, vy: 2.5 });
  }

  function applyPowerUp(type) {
    if (type === 'wide') {
      wideTimer = 600;
      if (paddle.w !== BASE_W * 2) setPaddleWidth(BASE_W * 2);
    } else if (type === 'multi') {
      if (state === 'ready') launch();
      if (state !== 'playing') return;
      var src = balls[0];
      var sx, sy, sp;
      if (src) { sx = src.x; sy = src.y; sp = Math.hypot(src.dx, src.dy) || levelSpeed(); }
      else { sx = paddle.x + paddle.w / 2; sy = paddle.y - R; sp = levelSpeed(); }
      var angs = [-35 * Math.PI / 180, 35 * Math.PI / 180];
      for (var i = 0; i < 2; i++) {
        balls.push({ x: sx, y: sy, dx: sp * Math.sin(angs[i]), dy: -sp * Math.cos(angs[i]) });
      }
    }
  }

  function updatePowerUps() {
    for (var i = powerups.length - 1; i >= 0; i--) {
      var p = powerups[i];
      p.y += p.vy;
      if (p.y + 7 >= paddle.y && p.y - 7 <= paddle.y + PADDLE_H &&
          p.x + 15 >= paddle.x && p.x - 15 <= paddle.x + paddle.w) {
        powerups.splice(i, 1);
        applyPowerUp(p.type);
        continue;
      }
      if (p.y - 10 > H) powerups.splice(i, 1);
    }
  }

  // ---------- Collisions ----------
  function hitBrick(b) {
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i];
      if (b.x + R > br.x && b.x - R < br.x + br.w && b.y + R > br.y && b.y - R < br.y + br.h) return br;
    }
    return null;
  }

  function damage(br) {
    br.hits--;
    score += 10;
    saveHigh();
    framesSinceHit = 0;
    if (br.hits <= 0) {
      var idx = bricks.indexOf(br);
      if (idx >= 0) bricks.splice(idx, 1);
      if (rng() < 0.1) {
        spawnPowerUp(rng() < 0.5 ? 'wide' : 'multi', br.x + br.w / 2, br.y + br.h / 2);
      }
    }
  }

  function moveBall(b) {
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(b.dx), Math.abs(b.dy)) / 2));
    for (var s = 0; s < steps; s++) {
      // X axis
      var mx = b.dx / steps;
      b.x += mx;
      if (b.x < R) { b.x = R; b.dx = Math.abs(b.dx); }
      else if (b.x > W - R) { b.x = W - R; b.dx = -Math.abs(b.dx); }
      var br = hitBrick(b);
      if (br) { b.x -= mx; b.dx = -b.dx; damage(br); }

      // Y axis
      var prevY = b.y;
      var my = b.dy / steps;
      b.y += my;
      if (b.y < R) { b.y = R; b.dy = Math.abs(b.dy); }
      br = hitBrick(b);
      if (br) { b.y = prevY; b.dy = -b.dy; damage(br); }

      // Paddle
      if (b.dy > 0 && prevY + R <= paddle.y + 0.001 && b.y + R >= paddle.y &&
          b.x >= paddle.x - R && b.x <= paddle.x + paddle.w + R) {
        var off = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        if (off > 1) off = 1; if (off < -1) off = -1;
        var ang = off * MAXA;
        var sp = Math.hypot(b.dx, b.dy) || levelSpeed();
        b.dx = sp * Math.sin(ang);
        b.dy = -sp * Math.cos(ang);
        b.y = paddle.y - R;
      }
      if (b.y - R > H) return false;
    }
    return true;
  }

  // ---------- Autopilot ----------
  function reflectX(x) {
    var lo = R, hi = W - R, span = hi - lo;
    var u = (x - lo) % (2 * span);
    if (u < 0) u += 2 * span;
    return u <= span ? lo + u : lo + 2 * span - u;
  }

  var stuckJitter = 0;

  function computeAim(landX) {
    var half = paddle.w / 2;
    var py = paddle.y - R;
    var bestAng = 0, bestScore = Infinity;
    var limit = MAXA * 0.85;
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i];
      var bx = br.x + br.w / 2, by = br.y + br.h / 2;
      var variants = [bx, 2 * R - bx, 2 * (W - R) - bx];
      for (var v = 0; v < 3; v++) {
        var dyT = py - by;
        if (dyT <= 0) continue;
        var ang = Math.atan((variants[v] - landX) / dyT);
        if (Math.abs(ang) > limit) continue;
        var sc = Math.abs(ang) + (v === 0 ? 0 : 0.15);
        if (sc < bestScore) { bestScore = sc; bestAng = ang; }
      }
    }
    if (framesSinceHit > 1500) {
      if (frame % 300 === 0 || stuckJitter === 0) stuckJitter = (rng() - 0.5) * 0.8;
      bestAng += stuckJitter;
    }
    var off = bestAng / MAXA;
    if (off > 0.9) off = 0.9; if (off < -0.9) off = -0.9;
    var desired = landX - off * half;
    if (desired < half) desired = half;
    if (desired > W - half) desired = W - half;
    return desired;
  }

  function runAutopilot() {
    var cx = paddle.x + paddle.w / 2;
    var target = cx;
    if (state === 'playing' && balls.length) {
      var py = paddle.y - R;
      var cands = [];
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (b.dy > 0 && b.y <= py) {
          var t = (py - b.y) / b.dy;
          cands.push({ t: t, land: reflectX(b.x + b.dx * t) });
        }
      }
      if (cands.length) {
        cands.sort(function (a, b) { return a.t - b.t; });
        var half = paddle.w / 2;
        var chosen = null;
        for (var k = 0; k < cands.length; k++) {
          var c = cands[k];
          var dist = Math.max(0, Math.abs(c.land - cx) - half * 0.9);
          if (dist <= AUTO_SPEED * c.t) { chosen = c; break; }
        }
        if (chosen) target = computeAim(chosen.land);
        else target = cands[0].land;
      } else {
        var low = balls[0];
        for (var j = 1; j < balls.length; j++) if (balls[j].y > low.y) low = balls[j];
        target = low.x;
      }
    }
    var d = target - cx;
    if (d > AUTO_SPEED) d = AUTO_SPEED;
    if (d < -AUTO_SPEED) d = -AUTO_SPEED;
    paddle.x += d;
  }

  // ---------- Simulation step ----------
  function step() {
    frame++;
    if (state === 'ready' || state === 'playing') {
      if (autopilot) runAutopilot();
      else {
        if (keys.left) paddle.x -= KEY_SPEED;
        if (keys.right) paddle.x += KEY_SPEED;
      }
    }
    clampPaddle();

    if (wideTimer > 0) {
      wideTimer--;
      if (wideTimer === 0) setPaddleWidth(BASE_W);
    }

    if (state === 'ready') {
      if (balls.length === 0) balls.push(heldBall());
      var hb = balls[0];
      hb.x = paddle.x + paddle.w / 2;
      hb.y = paddle.y - R;
      hb.dx = 0; hb.dy = 0;
      if (balls.length > 1) balls.length = 1;
      updatePowerUps();
      if (autopilot && state === 'ready') {
        readyTimer++;
        if (readyTimer >= 20) launch();
      }
    } else if (state === 'playing') {
      framesSinceHit++;
      for (var i = balls.length - 1; i >= 0; i--) {
        if (!moveBall(balls[i])) balls.splice(i, 1);
      }
      updatePowerUps();
      if (bricks.length === 0) {
        if (level < 3) loadLevel(level + 1);
        else { state = 'won'; balls = []; powerups = []; saveHigh(); }
      } else if (balls.length === 0) {
        lives--;
        if (lives <= 0) {
          lives = 0;
          state = 'over';
          powerups = [];
          saveHigh();
        } else {
          powerups = [];
          resetToReady();
        }
      }
    }
  }

  // ---------- Drawing ----------
  var rowColors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#1abc9c'];

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0, 0, W, H);

    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i];
      if (br.hits >= 2) {
        ctx.fillStyle = '#9aa4b1';
        roundRect(br.x, br.y, br.w, br.h, 4); ctx.fill();
        ctx.strokeStyle = '#e8eef5'; ctx.lineWidth = 2;
        roundRect(br.x + 1, br.y + 1, br.w - 2, br.h - 2, 4); ctx.stroke();
      } else {
        ctx.fillStyle = rowColors[br.row % rowColors.length];
        roundRect(br.x, br.y, br.w, br.h, 4); ctx.fill();
        if (br.maxHits >= 2) {
          ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(br.x + 20, br.y + 4); ctx.lineTo(br.x + 35, br.y + 14); ctx.lineTo(br.x + 48, br.y + 8); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(br.x + 3, br.y + 2, br.w - 6, 4);
    }

    // power-ups
    for (var p = 0; p < powerups.length; p++) {
      var pu = powerups[p];
      ctx.fillStyle = pu.type === 'wide' ? '#27ae60' : '#c0392b';
      roundRect(pu.x - 15, pu.y - 7, 30, 14, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pu.type === 'wide' ? 'W' : 'M', pu.x, pu.y + 1);
    }

    // paddle
    if (state !== 'over' && state !== 'won') {
      ctx.fillStyle = wideTimer > 0 ? '#2ecc71' : '#ecf0f1';
      roundRect(paddle.x, paddle.y, paddle.w, PADDLE_H, 6); ctx.fill();
    }

    // balls
    ctx.fillStyle = '#fff';
    for (var b = 0; b < balls.length; b++) {
      ctx.beginPath();
      ctx.arc(balls[b].x, balls[b].y, R, 0, Math.PI * 2);
      ctx.fill();
    }

    // HUD
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 15, 25);
    ctx.fillText('Lives: ' + lives, 185, 25);
    ctx.fillText('Level: ' + level, 315, 25);
    ctx.textAlign = 'right';
    ctx.fillText('High: ' + highScore, W - 15, 25);
    if (autopilot) {
      ctx.fillStyle = '#f1c40f';
      ctx.textAlign = 'left';
      ctx.fillText('AUTO', 450, 25);
    }

    // overlays
    ctx.textAlign = 'center';
    var st = paused && (state === 'ready' || state === 'playing') ? 'paused' : state;
    if (st === 'ready') {
      ctx.fillStyle = '#ddd'; ctx.font = '20px Arial';
      ctx.fillText('Press SPACE to launch', W / 2, H / 2 + 60);
    } else if (st === 'paused') {
      overlay('PAUSED', 'Press P to resume');
    } else if (st === 'over') {
      overlay('GAME OVER', 'Press SPACE to restart');
    } else if (st === 'won') {
      overlay('YOU WIN', 'Final score: ' + score + '  -  Press SPACE to play again');
    }
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 56px Arial';
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.font = '20px Arial';
    ctx.fillText(sub, W / 2, H / 2 + 30);
  }

  // ---------- Input ----------
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'over' || state === 'won') restart();
      else if (state === 'ready' && !paused) launch();
    } else if (k === 'p' || k === 'P') {
      if (e.repeat) return;
      if (state === 'ready' || state === 'playing') paused = !paused;
    } else if (k === 'a' || k === 'A') {
      if (e.repeat) return;
      autopilot = !autopilot;
      readyTimer = 0;
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    else if (e.key === 'ArrowRight') keys.right = false;
  });
  canvas.addEventListener('mousemove', function (e) {
    if (autopilot || paused) return;
    if (state !== 'ready' && state !== 'playing') return;
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = mx - paddle.w / 2;
    clampPaddle();
    if (state === 'ready' && balls[0]) balls[0].x = paddle.x + paddle.w / 2;
  });

  // ---------- Test interface ----------
  var api = {
    tick: function (n) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      for (var i = 0; i < n; i++) step();
    },
    seed: function (n) {
      rngState = (Math.floor(Number(n) || 0)) | 0;
    },
    setBall: function (x, y, dx, dy) {
      balls = [{ x: +x, y: +y, dx: +dx, dy: +dy }];
      state = 'playing';
      paused = false;
      framesSinceHit = 0;
    },
    spawnPowerUp: function (type, x, y) {
      spawnPowerUp(type, x, y);
    }
  };
  Object.defineProperties(api, {
    score: { get: function () { return score; }, set: function (v) { score = +v || 0; saveHigh(); }, enumerable: true },
    lives: { get: function () { return lives; }, set: function (v) { lives = +v || 0; }, enumerable: true },
    level: { get: function () { return level; }, enumerable: true },
    state: {
      get: function () { return (paused && (state === 'ready' || state === 'playing')) ? 'paused' : state; },
      enumerable: true
    },
    balls: { get: function () { return balls; }, enumerable: true },
    paddle: { get: function () { return paddle; }, enumerable: true },
    bricks: { get: function () { return bricks; }, enumerable: true },
    bricksLeft: { get: function () { return bricks.length; }, enumerable: true },
    autopilot: { get: function () { return autopilot; }, set: function (v) { autopilot = !!v; readyTimer = 0; }, enumerable: true },
    highScore: { get: function () { return highScore; }, enumerable: true },
    powerUps: { get: function () { return powerups; }, enumerable: true }
  });
  window.game = api;

  // ---------- Main loop ----------
  function loop() {
    try {
      if (!paused) step();
      draw();
    } catch (err) {
      // keep the loop alive; should never happen
    }
    requestAnimationFrame(loop);
  }

  restart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

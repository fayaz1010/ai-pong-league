<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0f1a; color: #ddd; font-family: Arial, Helvetica, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding-top: 16px; }
  canvas { display: block; background: #111827; border: 2px solid #334; box-shadow: 0 0 24px rgba(80,120,255,0.25); }
  #help { margin-top: 10px; font-size: 13px; color: #9aa; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="help">← → / Mouse: move &nbsp;|&nbsp; Space: launch / restart &nbsp;|&nbsp; P: pause &nbsp;|&nbsp; A: autopilot</div>
</div>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var W = 800, H = 600, R = 7, BASE_W = 100, PADDLE_Y = 570, PADDLE_H = 12;
  var MAXA = 1.05; // max bounce angle from vertical (rad)
  var KEY_SPEED = 8, AUTO_SPEED = 20, PU_SPEED = 3;

  // ---------- deterministic RNG ----------
  var rngState = (Date.now() >>> 0) || 1;
  function rand() {
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    var t = rngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---------- state ----------
  var score = 0, lives = 3, level = 1, state = 'ready', paused = false;
  var balls = [], bricks = [], powerups = [];
  var paddle = { x: (W - BASE_W) / 2, y: PADDLE_Y, w: BASE_W, h: PADDLE_H };
  var wideTimer = 0, autopilot = false, readyTimer = 0, aimCounter = 0;
  var keys = { left: false, right: false };
  var high = 0;
  try { high = parseInt(localStorage.getItem('bb_highscore'), 10) || 0; } catch (e) { high = 0; }

  function saveHigh() {
    if (score > high) {
      high = score;
      try { localStorage.setItem('bb_highscore', String(high)); } catch (e) {}
    }
  }

  function levelSpeed() { return 4.5 + level * 0.5; }

  function clampPaddle() {
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > W) paddle.x = W - paddle.w;
  }
  function setPaddleW(nw) {
    var c = paddle.x + paddle.w / 2;
    paddle.w = nw;
    paddle.x = c - nw / 2;
    clampPaddle();
  }

  function buildLevel(l) {
    bricks = [];
    var cols = 10, bw = 70, bh = 22, gx = 6, gy = 6, ox = 23, oy = 60;
    var rows = l === 1 ? 5 : 6;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var hits = 1;
        if (l === 2 && r < 2) hits = 2;
        if (l === 3) {
          if ((r === 2 || r === 3) && (c === 4 || c === 5)) continue;
          if (r === 0 || r === 5 || c === 0 || c === 9) hits = 2;
        }
        bricks.push({ x: ox + c * (bw + gx), y: oy + r * (bh + gy), w: bw, h: bh, hits: hits, max: hits, row: r });
      }
    }
  }

  function resetBallOnPaddle() {
    balls = [{ x: paddle.x + paddle.w / 2, y: PADDLE_Y - R - 1, dx: 0, dy: 0 }];
    state = 'ready';
    readyTimer = 0;
  }

  function newGame() {
    score = 0; lives = 3; level = 1;
    paused = false;
    buildLevel(1);
    powerups = [];
    wideTimer = 0;
    paddle.w = BASE_W;
    paddle.x = (W - BASE_W) / 2;
    resetBallOnPaddle();
  }

  function launch() {
    if (state !== 'ready') return;
    var a = (rand() * 2 - 1) * 0.45;
    var s = levelSpeed();
    var b = balls[0];
    if (!b) { b = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - R - 1, dx: 0, dy: 0 }; balls = [b]; }
    b.dx = s * Math.sin(a);
    b.dy = -s * Math.cos(a);
    state = 'playing';
  }

  function spawnPowerUp(type, x, y) {
    if (type !== 'wide' && type !== 'multi') return;
    powerups.push({ type: type, x: +x, y: +y, w: 30, h: 14 });
  }

  function applyPowerUp(type) {
    if (type === 'wide') {
      if (paddle.w < BASE_W * 2) setPaddleW(BASE_W * 2);
      wideTimer = 600;
    } else if (type === 'multi') {
      if (state === 'ready') launch();
      var base = null;
      for (var i = 0; i < balls.length; i++) {
        if (balls[i].y < PADDLE_Y) { base = balls[i]; break; }
      }
      if (!base) base = balls[0] || { x: paddle.x + paddle.w / 2, y: PADDLE_Y - R - 1, dx: 0, dy: -levelSpeed() };
      var s = Math.hypot(base.dx, base.dy);
      if (s < 3) s = levelSpeed();
      var angs = [-0.5, 0.5];
      for (var k = 0; k < 2; k++) {
        balls.push({ x: base.x, y: Math.min(base.y, PADDLE_Y - R - 1), dx: s * Math.sin(angs[k]), dy: -s * Math.cos(angs[k]) });
      }
      state = 'playing';
    }
  }

  function hitBrick(i) {
    var b = bricks[i];
    b.hits--;
    score += 10;
    saveHigh();
    if (b.hits <= 0) {
      bricks.splice(i, 1);
      if (rand() < 0.1) {
        spawnPowerUp(rand() < 0.5 ? 'wide' : 'multi', b.x + b.w / 2, b.y + b.h / 2);
      }
    }
  }

  function updateBall(b) {
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(b.dx), Math.abs(b.dy)) / 3));
    for (var s = 0; s < steps; s++) {
      b.x += b.dx / steps;
      b.y += b.dy / steps;
      // walls
      if (b.x - R < 0) { b.x = R; b.dx = Math.abs(b.dx); }
      if (b.x + R > W) { b.x = W - R; b.dx = -Math.abs(b.dx); }
      if (b.y - R < 0) { b.y = R; b.dy = Math.abs(b.dy); }
      // paddle
      if (b.dy > 0 && b.y + R >= paddle.y && b.y <= paddle.y + paddle.h / 2 + 2 &&
          b.x >= paddle.x - R && b.x <= paddle.x + paddle.w + R) {
        var rel = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        if (rel < -1) rel = -1; if (rel > 1) rel = 1;
        var ang = rel * MAXA;
        var sp = Math.hypot(b.dx, b.dy);
        if (sp < 3) sp = 3;
        b.dx = sp * Math.sin(ang);
        b.dy = -sp * Math.cos(ang);
        b.y = paddle.y - R;
        aimCounter++;
      }
      // bricks
      for (var i = 0; i < bricks.length; i++) {
        var br = bricks[i];
        var cx = b.x < br.x ? br.x : (b.x > br.x + br.w ? br.x + br.w : b.x);
        var cy = b.y < br.y ? br.y : (b.y > br.y + br.h ? br.y + br.h : b.y);
        var ddx = b.x - cx, ddy = b.y - cy;
        if (ddx * ddx + ddy * ddy < R * R) {
          var ovX = Math.min(b.x + R - br.x, br.x + br.w - (b.x - R));
          var ovY = Math.min(b.y + R - br.y, br.y + br.h - (b.y - R));
          if (ovX < ovY) {
            if (b.x < br.x + br.w / 2) { b.dx = -Math.abs(b.dx); b.x = br.x - R; }
            else { b.dx = Math.abs(b.dx); b.x = br.x + br.w + R; }
          } else {
            if (b.y < br.y + br.h / 2) { b.dy = -Math.abs(b.dy); b.y = br.y - R; }
            else { b.dy = Math.abs(b.dy); b.y = br.y + br.h + R; }
          }
          hitBrick(i);
          break;
        }
      }
    }
  }

  // ---------- autopilot ----------
  var expArr = null, expLen = -1, expList = [];
  function exposedBricks() {
    if (expArr !== bricks || expLen !== bricks.length) {
      expArr = bricks; expLen = bricks.length; expList = [];
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i], covered = false;
        for (var j = 0; j < bricks.length; j++) {
          var c = bricks[j];
          if (c !== b && c.y > b.y && c.x < b.x + b.w && c.x + c.w > b.x) { covered = true; break; }
        }
        if (!covered) expList.push(b);
      }
      if (!expList.length) expList = bricks.slice();
    }
    return expList;
  }

  function predictX(b) {
    var targetY = paddle.y - R;
    var t = (targetY - b.y) / b.dy;
    var x = b.x + b.dx * t;
    var span = W - 2 * R;
    var u = x - R;
    var m = ((u % (2 * span)) + 2 * span) % (2 * span);
    if (m > span) m = 2 * span - m;
    return R + m;
  }

  function autopilotMove() {
    var desired = paddle.x + paddle.w / 2;
    if (state === 'ready') {
      desired = W / 2;
    } else {
      var best = null, bestT = Infinity;
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (b.dy > 0 && b.y <= paddle.y + 2) {
          var t = (paddle.y - R - b.y) / b.dy;
          if (t < bestT) { bestT = t; best = b; }
        }
      }
      if (best) {
        var px = predictX(best);
        var rel = 0;
        var ex = exposedBricks();
        if (ex.length) {
          var tg = ex[aimCounter % ex.length];
          var tx = tg.x + tg.w / 2, ty = tg.y + tg.h / 2;
          var th = Math.atan2(tx - px, paddle.y - ty);
          var lim = 0.8 * MAXA;
          if (th > lim) th = lim; if (th < -lim) th = -lim;
          rel = th / MAXA;
        }
        desired = px - rel * paddle.w / 2;
      } else if (balls.length) {
        var low = balls[0];
        for (var k = 1; k < balls.length; k++) if (balls[k].y > low.y) low = balls[k];
        desired = low.x;
      }
    }
    var cur = paddle.x + paddle.w / 2;
    var d = desired - cur;
    if (d > AUTO_SPEED) d = AUTO_SPEED;
    if (d < -AUTO_SPEED) d = -AUTO_SPEED;
    paddle.x += d;
    clampPaddle();
  }

  function movePaddle() {
    if (autopilot) { autopilotMove(); return; }
    if (keys.left) paddle.x -= KEY_SPEED;
    if (keys.right) paddle.x += KEY_SPEED;
    clampPaddle();
  }

  function levelCleared() {
    powerups = [];
    wideTimer = 0;
    setPaddleW(BASE_W);
    if (level >= 3) {
      state = 'won';
      balls = [];
    } else {
      level++;
      buildLevel(level);
      resetBallOnPaddle();
    }
  }

  // ---------- one simulation frame ----------
  function step() {
    if (state === 'ready') {
      movePaddle();
      if (balls[0]) { balls[0].x = paddle.x + paddle.w / 2; balls[0].y = PADDLE_Y - R - 1; balls[0].dx = 0; balls[0].dy = 0; }
      else resetBallOnPaddle();
      if (autopilot) {
        readyTimer++;
        if (readyTimer >= 30) launch();
      }
      return;
    }
    if (state !== 'playing') return;

    movePaddle();

    if (wideTimer > 0) {
      wideTimer--;
      if (wideTimer === 0) setPaddleW(BASE_W);
    }

    for (var i = 0; i < balls.length; i++) updateBall(balls[i]);

    // power-ups
    for (var p = powerups.length - 1; p >= 0; p--) {
      var pu = powerups[p];
      pu.y += PU_SPEED;
      if (pu.y + pu.h / 2 >= paddle.y && pu.y - pu.h / 2 <= paddle.y + paddle.h &&
          pu.x + pu.w / 2 >= paddle.x && pu.x - pu.w / 2 <= paddle.x + paddle.w) {
        powerups.splice(p, 1);
        applyPowerUp(pu.type);
      } else if (pu.y - pu.h / 2 > H) {
        powerups.splice(p, 1);
      }
    }

    // lost balls
    var kept = [];
    for (var j = 0; j < balls.length; j++) if (balls[j].y - R <= H) kept.push(balls[j]);
    balls = kept;

    if (bricks.length === 0) { levelCleared(); return; }

    if (balls.length === 0) {
      lives--;
      powerups = [];
      wideTimer = 0;
      setPaddleW(BASE_W);
      if (lives <= 0) {
        lives = 0;
        state = 'over';
        balls = [];
      } else {
        resetBallOnPaddle();
      }
    }
  }

  // ---------- rendering ----------
  var rowColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#ec4899'];
  function draw() {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, W, H);

    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (b.hits >= 2) ctx.fillStyle = '#94a3b8';
      else if (b.max >= 2) ctx.fillStyle = '#cbd5e1';
      else ctx.fillStyle = rowColors[(b.row || 0) % rowColors.length];
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x, b.y, b.w, 4);
      if (b.hits >= 2) {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6);
      } else if (b.max >= 2) {
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
        ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.6);
        ctx.lineTo(b.x + b.w * 0.65, b.y + b.h - 2);
        ctx.stroke();
      }
    }

    // power-ups
    for (var p = 0; p < powerups.length; p++) {
      var pu = powerups[p];
      ctx.fillStyle = pu.type === 'wide' ? '#10b981' : '#f43f5e';
      ctx.fillRect(pu.x - pu.w / 2, pu.y - pu.h / 2, pu.w, pu.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pu.type === 'wide' ? 'W' : 'M', pu.x, pu.y + 1);
    }

    // paddle
    ctx.fillStyle = wideTimer > 0 ? '#34d399' : '#60a5fa';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, 3);

    // balls
    ctx.fillStyle = '#f8fafc';
    for (var k = 0; k < balls.length; k++) {
      ctx.beginPath();
      ctx.arc(balls[k].x, balls[k].y, R, 0, Math.PI * 2);
      ctx.fill();
    }

    // HUD
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = '#e5e7eb';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 16, 26);
    ctx.fillText('Lives: ' + lives, 170, 26);
    ctx.fillText('Level: ' + level, 290, 26);
    ctx.fillText('High: ' + high, 410, 26);
    ctx.textAlign = 'right';
    ctx.fillStyle = autopilot ? '#fbbf24' : '#6b7280';
    ctx.fillText('Autopilot: ' + (autopilot ? 'ON' : 'OFF'), W - 16, 26);

    // overlays
    ctx.textAlign = 'center';
    if (state === 'ready' && !paused) {
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '18px Arial';
      ctx.fillText('Press SPACE to launch', W / 2, 400);
    }
    if (paused) overlay('PAUSED', 'Press P to resume');
    if (state === 'over') overlay('GAME OVER', 'Press SPACE to restart');
    if (state === 'won') overlay('YOU WIN', 'Final score: ' + score + '  —  Press SPACE to play again');
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 56px Arial';
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.font = '18px Arial';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(sub, W / 2, H / 2 + 30);
  }

  // ---------- input ----------
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (paused) return;
      if (state === 'ready') launch();
      else if (state === 'over' || state === 'won') newGame();
    } else if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'ready') paused = !paused;
    } else if (k === 'a' || k === 'A') {
      autopilot = !autopilot;
      readyTimer = 0;
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    else if (e.key === 'ArrowRight') keys.right = false;
  });
  canvas.addEventListener('mousemove', function (e) {
    if (autopilot || paused) return;
    if (state !== 'playing' && state !== 'ready') return;
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = mx - paddle.w / 2;
    clampPaddle();
    if (state === 'ready' && balls[0]) balls[0].x = paddle.x + paddle.w / 2;
  });

  // ---------- test interface ----------
  window.game = {
    get score() { return score; },
    get lives() { return lives; },
    get level() { return level; },
    get state() { return paused ? 'paused' : state; },
    get balls() { return balls; },
    get paddle() { return paddle; },
    get bricks() { return bricks; },
    get bricksLeft() { return bricks.length; },
    get autopilot() { return autopilot; },
    set autopilot(v) { autopilot = !!v; readyTimer = 0; },
    tick: function (n) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      for (var i = 0; i < n; i++) step();
    },
    seed: function (n) {
      rngState = (Math.floor(Number(n) || 0)) >>> 0;
    },
    setBall: function (x, y, dx, dy) {
      balls = [{ x: +x, y: +y, dx: +dx, dy: +dy }];
      state = 'playing';
      paused = false;
    },
    spawnPowerUp: function (type, x, y) { spawnPowerUp(type, x, y); }
  };

  // ---------- main loop ----------
  newGame();
  function frame() {
    try {
      if (!paused) step();
      draw();
    } catch (err) {
      // keep the loop alive
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
